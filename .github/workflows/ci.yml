# Every push and pull request is checked. A push to main that passes is then deployed:
# D1 migrations first, so the new code never runs against an older schema, then the
# OpenNext build and Wrangler upload (`pnpm run deploy`).
#
# Deploying needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts: Edit and D1: Edit on the account
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Worker and the D1 database

name: CI

on:
  push:
    branches: [main]
    # The README and its images change nothing that runs: no checks, no deploy.
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read
  # The deploy job looks up the last successful run, to see whether migrations changed.
  actions: read

jobs:
  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  deploy:
    name: Migrate and deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, in push order; a running deploy is never cut off midway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://stocktake.web-applications.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to compare drizzle/ with the last successful deploy.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Wrangler applies only migrations the remote database hasn't seen, and answers its
      # confirmation prompt with yes outside a terminal. The previous Worker keeps serving
      # until the next step finishes, so a migration must not break the code before it:
      # add, never rename or drop in the same deploy.
      # Only ask D1 about migrations when drizzle/ changed since the last deploy that went
      # through: a code-only deploy then never depends on the database being reachable
      # (on 2026-11-23 the free plan's daily read allowance ran out and blocked deploys
      # that had nothing to migrate). With no earlier successful run, it always migrates.
      - name: Look for new migrations since the last successful deploy
        id: migrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- drizzle/; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "drizzle/ is unchanged since $last, the last successful deploy: nothing to migrate."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "drizzle/ changed since ${last:-the start}: applying migrations."
          fi
      - name: Apply D1 migrations
        if: steps.migrations.outputs.pending == 'true'
        run: pnpm db:migrate:remote
      - name: Build and deploy the Worker
        run: pnpm run deploy
